name: Validate template
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm check:examples
  test-latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/compile-latex
        with:
          content-directory: tests/fixtures/latex
      - uses: actions/upload-artifact@v4
        with:
          name: latex-smoke-pdfs
          path: tests/fixtures/latex/public/assets/pdf/*.pdf
  build-demo:
    needs: [test, test-latex]
    if: github.repository == 'zzxzzk115/academic-casual-template' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build and verify the Einstein demo
        env:
          DEMO_ORIGIN: ${{ steps.pages.outputs.origin }}
          DEMO_BASE: ${{ steps.pages.outputs.base_path }}
        run: pnpm demo:build --url "$DEMO_ORIGIN" --base "$DEMO_BASE"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .cache/demo-dist
  deploy-demo:
    needs: build-demo
    if: github.repository == 'zzxzzk115/academic-casual-template' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
